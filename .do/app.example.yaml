# =============================================================================
# DigitalOcean App Platform Spec — EXAMPLE TEMPLATE
#
# Copy this file to app.yaml and replace all "your-*" placeholders with
# your own values before deploying.
#
# IMPORTANT: Never commit app.yaml with real credentials.
# =============================================================================
name: anansi
region: ams

# =============================================================================
# Custom Domains
# IMPORTANT: This section MUST be preserved during any spec updates.
# DNS: your-app.example.com CNAME -> your-app-id.ondigitalocean.app
# =============================================================================
domains:
  - domain: your-app.example.com
    type: PRIMARY

# =============================================================================
# App-Level Environment Variables (shared across all services)
# =============================================================================
envs:
  # API Security
  - key: API_KEY
    value: "${API_KEY}"
    scope: RUN_TIME
    type: SECRET
  # Shared secret for the external notification passthrough (POST /chat/notify).
  # n8n/VRM/Grafana upstream must send it in the X-Notify-Secret header.
  # Fail-closed: if unset, /chat/notify rejects all requests.
  - key: NOTIFY_SHARED_SECRET
    value: "${NOTIFY_SHARED_SECRET}"
    scope: RUN_TIME
    type: SECRET
  # Distinct from API_KEY -- lets identity-trusted callers (e.g. the Skill
  # Builder) assert a caller-supplied user_email when auth-DB lookup misses.
  # Must be set to the same value anansi-app sends as X-Identity-Assertion-Key
  # (see anansi_app/.env.example). Unset (default) fails closed: nobody can
  # use the fallback. See chat_orchestrator/orchestrator/api/app.py's
  # is_identity_trusted_caller.
  - key: IDENTITY_ASSERTION_KEY
    value: "${IDENTITY_ASSERTION_KEY}"
    scope: RUN_TIME
    type: SECRET

  # Google OAuth client (anansi-app's Web-application-type client - see
  # anansi_app/nicegui_app/auth.py). App-level, not anansi-app-scoped: the
  # mcp-gateway service below reuses this exact client for its own callback
  # (a Web-application client supports more than one redirect URI) via
  # gateway/google_oauth_client.py's GOOGLE_CLIENT_ID/AUTH_CLIENT_ID
  # fallback - only an app-level env var is visible to every service, a
  # service-scoped one is not. Add the gateway's callback URL as a second
  # Authorized redirect URI on this same client in Google Cloud Console
  # (MCP_GATEWAY_BASE_URL + /oauth/google-callback, below) rather than
  # registering a separate client.
  - key: AUTH_CLIENT_ID
    value: "${AUTH_CLIENT_ID}"
    scope: RUN_TIME
    type: SECRET
  - key: AUTH_CLIENT_SECRET
    value: "${AUTH_CLIENT_SECRET}"
    scope: RUN_TIME
    type: SECRET

  # Logging (can be changed via anansi-app Settings UI)
  - key: LOG_LEVEL
    value: "INFO"
    scope: RUN_TIME

  # Canonical public URL of the Anansi app
  - key: APP_URL
    value: "https://your-app.example.com"
    scope: RUN_TIME

  # Chat Database (Supabase) - legacy name still used by some components
  - key: SUPABASE_URL
    value: "${SUPABASE_URL}"
    scope: RUN_TIME
  - key: SUPABASE_KEY
    value: "${SUPABASE_KEY}"
    scope: RUN_TIME
    type: SECRET

  # Chat Database (preferred names)
  - key: CHAT_DB_URL
    value: "${CHAT_DB_URL}"
    scope: RUN_TIME
  - key: CHAT_DB_SERVICE_KEY
    value: "${CHAT_DB_SERVICE_KEY}"
    scope: RUN_TIME
    type: SECRET

  # Auth Database
  - key: AUTH_DB_DIRECT_CONNECTION
    value: "true"
    scope: RUN_TIME
  - key: AUTH_DB_HOST
    value: "${AUTH_DB_HOST}"
    scope: RUN_TIME
    type: SECRET
  - key: AUTH_DB_PORT
    value: "6543"
    scope: RUN_TIME
  - key: AUTH_DB_NAME
    value: "postgres"
    scope: RUN_TIME
  - key: AUTH_DB_USER
    value: "${AUTH_DB_USER}"
    scope: RUN_TIME
    type: SECRET
  - key: AUTH_DB_PASSWORD
    value: "${AUTH_DB_PASSWORD}"
    scope: RUN_TIME
    type: SECRET
  - key: AUTH_DB_SSL_MODE
    value: "require"
    scope: RUN_TIME

  # Session ID Security
  - key: SESSION_ID_SECRET
    value: "${SESSION_ID_SECRET}"
    scope: RUN_TIME
    type: SECRET

  # Google Services
  - key: GOOGLE_API_KEY
    value: "${GOOGLE_API_KEY}"
    scope: RUN_TIME
    type: SECRET
  - key: GOOGLE_SERVICE_ACCOUNT_JSON
    value: "${GOOGLE_SERVICE_ACCOUNT_JSON}"
    scope: RUN_TIME
    type: SECRET

  # Google Docs - System Instructions (doc IDs, not secrets)
  - key: CUSTOMER_SUPPORT_DOC_ID
    value: "your-customer-support-doc-id"  # pragma: allowlist secret
    scope: RUN_TIME
  - key: STAFF_SUPPORT_DOC_ID
    value: "your-staff-support-doc-id"  # pragma: allowlist secret
    scope: RUN_TIME

  # Telegram
  - key: TELEGRAM_BOT_TOKEN
    value: "${TELEGRAM_BOT_TOKEN}"
    scope: RUN_TIME
    type: SECRET
  - key: TELEGRAM_BOT_USERNAME
    value: "${TELEGRAM_BOT_USERNAME}"
    scope: RUN_TIME
  - key: ESCALATION_TELEGRAM_CHAT_ID
    value: "your-escalation-telegram-chat-id"
    scope: RUN_TIME
  - key: DEBUG_TELEGRAM_CHAT_ID
    value: "your-debug-telegram-chat-id"
    scope: RUN_TIME

  # LLM Settings
  - key: ALLOW_PARALLEL_CALLS
    value: "true"
    scope: RUN_TIME
  - key: MAX_TOOL_ROUNDS
    value: "3"
    scope: RUN_TIME
  - key: GEMINI_TEMPERATURE
    value: "0.2"
    scope: RUN_TIME
  # MODEL_THINKING/MODEL_FAST/MODEL_LITE/FALLBACK_MODEL must stay app-level,
  # not under any specific service's envs: below. DigitalOcean gives a
  # per-service env entry precedence over an app-level one with the same key,
  # so if any of these ever gets added under a service's envs: block, an
  # operator changing it from the Settings UI (which always writes app-level)
  # will silently have no effect on that service.
  - key: MODEL_THINKING
    value: "gemini-pro-latest"
    scope: RUN_TIME
  - key: MODEL_FAST
    value: "gemini-flash-latest"
    scope: RUN_TIME
  - key: MODEL_LITE
    value: "gemini-2.5-flash-lite"
    scope: RUN_TIME
  - key: FALLBACK_MODEL
    value: "gemini-2.5-flash"
    scope: RUN_TIME

  # Feature Flags
  - key: DEBUG
    value: "false"
    scope: RUN_TIME
  - key: DEVELOPMENT_MODE
    value: "false"
    scope: RUN_TIME
  - key: BOT_ENABLED
    value: "true"
    scope: RUN_TIME

  # Action Feature Flags (tools that write/modify data)
  - key: JIRA_ACTIONS_ENABLED
    value: "true"
    scope: RUN_TIME
  - key: CALIN_ACTIONS_ENABLED
    value: "false"
    scope: RUN_TIME
  - key: GRAFANA_ACTIONS_ENABLED
    value: "true"
    scope: RUN_TIME

  # RAG Settings
  - key: rag__enabled
    value: "true"
    scope: RUN_TIME
  - key: rag__top_k
    value: "5"
    scope: RUN_TIME

  # Metrics
  - key: METRICS_ENABLED
    value: "true"
    scope: RUN_TIME
  - key: METRICS_SCHEDULE_HOUR
    value: "9"
    scope: RUN_TIME
  - key: METRICS_TIMEZONE
    value: "UTC"
    scope: RUN_TIME

  # Grafana
  - key: GRAFANA_URL
    value: "https://grafana.example.com"
    scope: RUN_TIME
  - key: GRAFANA_USERNAME
    value: "your-grafana-user"
    scope: RUN_TIME
  - key: GRAFANA_PASSWORD
    value: "${GRAFANA_PASSWORD}"
    scope: RUN_TIME
    type: SECRET
  - key: GRAFANA_FOLDER_NAME
    value: ""
    scope: RUN_TIME
  - key: ORGANIZATION_NAME
    value: "Your Organization"
    scope: RUN_TIME
  - key: GRAFANA_PANEL_DESCRIPTION_PROMPT
    value: "You are a system that generates tool descriptions for Grafana dashboard panels. Given a panel with title, description, query, and dashboard variables, create a concise tool description that explains what data this panel shows and what variables it requires. Format: A tool description suitable for an LLM to understand when to use this panel."
    scope: RUN_TIME
  - key: GRAFANA_ENABLED_PANELS
    value: ""
    scope: RUN_TIME
  - key: GRAFANA_ENABLED_DASHBOARDS
    value: ""
    scope: RUN_TIME
  - key: GRAFANA_SYNC_HOUR
    value: "2"
    scope: RUN_TIME
  # Episodic memory distiller (anansi_app/scripts/episodic_scheduler.py, started
  # from start.sh). Writes episodic_distillations, which the `episodic` context
  # module reads. Defaults to 03:00 -- an hour after GRAFANA_SYNC_HOUR, so the
  # two LLM-heavy nightly batches in that container don't compete for rate
  # limit. Both keys are optional; set EPISODIC_DISTILL_ENABLED=false to stop
  # the daemon. Uses METRICS_TIMEZONE, like the Grafana one.
  - key: EPISODIC_DISTILL_HOUR
    value: "3"
    scope: RUN_TIME
  - key: GRAFANA_FORCE_FULL_REINDEX
    value: "true"
    scope: RUN_TIME

  # Admin UI
  - key: ALLOWED_VIEWER_EMAILS
    value: "admin@example.com"
    scope: RUN_TIME
  - key: STAFF_ORG_NAME
    value: "Staff"
    scope: RUN_TIME
  - key: DEFAULT_BROADCAST_GROUPS
    value: ""
    scope: RUN_TIME

  # JIRA
  - key: JIRA_BASE_URL
    value: "https://your-org.atlassian.net"
    scope: RUN_TIME
  - key: JIRA_USERNAME
    value: "admin@example.com"
    scope: RUN_TIME
  - key: JIRA_API_TOKEN
    value: "${JIRA_API_TOKEN}"
    scope: RUN_TIME
    type: SECRET
  - key: JIRA_OPS_CLOUD_ID
    value: "your-jira-ops-cloud-id"
    scope: RUN_TIME
  - key: JIRA_OPS_SCHEDULE_ID
    value: "your-jira-ops-schedule-id"
    scope: RUN_TIME

  # TimescaleDB
  - key: TIMESCALE_HOST
    value: "your-timescale-host.tsdb.cloud.timescale.com"
    scope: RUN_TIME
  - key: TIMESCALE_PORT
    value: "37244"
    scope: RUN_TIME
  - key: TIMESCALE_DATABASE
    value: "tsdb"
    scope: RUN_TIME
  - key: TIMESCALE_USER
    value: "your-timescale-user"
    scope: RUN_TIME
  - key: TIMESCALE_PASSWORD
    value: "${TIMESCALE_PASSWORD}"
    scope: RUN_TIME
    type: SECRET

  # Calin Meter API V1
  - key: CALIN_V1_BASE_URL
    value: "http://your-calin-v1-host:6001"
    scope: RUN_TIME
  - key: CALIN_V1_USERNAME
    value: "your-calin-v1-username"
    scope: RUN_TIME
  - key: CALIN_V1_PASSWORD
    value: "${CALIN_V1_PASSWORD}"
    scope: RUN_TIME
    type: SECRET
  - key: CALIN_V1_COMPANY
    value: "YOUR_COMPANY"
    scope: RUN_TIME

  # Calin Meter API V2
  - key: CALIN_V2_BASE_URL
    value: "http://your-calin-v2-host:9400"
    scope: RUN_TIME
  - key: CALIN_V2_USERNAME
    value: "your-calin-v2-username"
    scope: RUN_TIME
  - key: CALIN_V2_PASSWORD
    value: "${CALIN_V2_PASSWORD}"
    scope: RUN_TIME
    type: SECRET
  - key: CALIN_V2_COMPANY
    value: "YOUR_COMPANY"
    scope: RUN_TIME

  # VRM (Victron Remote Management)
  - key: VRM_TOKEN
    value: "${VRM_TOKEN}"
    scope: RUN_TIME
    type: SECRET
  - key: VRM_MQTT_USER
    value: "vrm.mqtt@example.com"
    scope: RUN_TIME
  - key: VRM_MQTT_PASSWORD
    value: "${VRM_MQTT_PASSWORD}"
    scope: RUN_TIME
    type: SECRET

  # ChirpStack (LoRaWAN)
  - key: CHIRPSTACK_BASE_URL
    value: "https://lorawan.example.com"
    scope: RUN_TIME

  # Metering Platform API
  - key: METERING_API_URL
    value: "https://your-metering-api.example.com/"
    scope: RUN_TIME
  - key: METERING_BEARER_TOKEN
    value: "${METERING_BEARER_TOKEN}"
    scope: RUN_TIME
    type: SECRET

# =============================================================================
# Ingress Rules
# =============================================================================
ingress:
  rules:
    # preserve_path_prefix is required here: DigitalOcean strips the matched
    # prefix before forwarding by default, so without it a request to
    # /chat/notify would reach the chat-orchestrator container as bare
    # /notify (no such route -> 404) and a request to bare /chat would
    # collapse to / (the wrong handler). Omitting this on just the /chat
    # rule broke every nested route under /chat in production while /chat
    # itself kept "working" by accident (both handlers share the same auth
    # check, so the misrouted response looked plausible).
    - component:
        name: chat-orchestrator
        preserve_path_prefix: true
      match:
        path:
          prefix: /chat
    - component:
        name: chat-orchestrator
        preserve_path_prefix: true
      match:
        path:
          prefix: /mini-app
    - component:
        name: chat-orchestrator
        preserve_path_prefix: true
      match:
        path:
          prefix: /api/mini-app
    # Without this rule, /webhook/jira falls through to the catch-all below
    # and gets swallowed by anansi-app's login gate -- a request that never
    # reaches chat-orchestrator at all, with no error anywhere: Jira sees a
    # 200 (after the redirect resolves) and never retries or alerts. Found
    # via a real ticket close producing no Telegram notification, and zero
    # matching lines in chat-orchestrator's own logs for the entire window.
    - component:
        name: chat-orchestrator
        preserve_path_prefix: true
      match:
        path:
          prefix: /webhook
    # Per-user MCP access for external clients (Claude, Codex) - see
    # mcp_servers/gateway/. preserve_path_prefix is DELIBERATELY OMITTED
    # here, unlike every rule above - the opposite reasoning from the /chat
    # rule's comment applies. chat-orchestrator's own route table includes
    # its prefixes (a real /chat/notify handler exists), so DO must forward
    # the full path unstripped. gateway/app.py's routes are the reverse:
    # they're all bare (/oauth/authorize, /mcp, /healthz, /.well-known/...),
    # with no /mcp-gateway prefix baked in anywhere. Setting true here would
    # forward the unstripped /mcp-gateway/oauth/authorize to a container
    # whose route table only knows /oauth/authorize - a 404 on every single
    # request. Omitting it (the default) makes DO strip /mcp-gateway before
    # forwarding, so the container sees the bare paths it actually serves.
    # MCP_GATEWAY_BASE_URL below must end in /mcp-gateway to match - that's
    # what makes the discovery documents advertise the client-facing URL
    # this rule expects.
    - component:
        name: mcp-gateway
      match:
        path:
          prefix: /mcp-gateway
    - component:
        name: anansi-app
      match:
        path:
          prefix: /

# =============================================================================
# Services
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # Service 1: Chat Orchestrator
  # Main API endpoint for chat interactions
  # IMPORTANT: Uses Dockerfile to include shared/ and rag_pipeline/ directories
  # ---------------------------------------------------------------------------
  - name: chat-orchestrator
    github:
      repo: your-org/anansi
      branch: main
      deploy_on_push: true
    dockerfile_path: chat_orchestrator/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs  # 512MB RAM, 1 vCPU
    termination:
      drain_seconds: 30        # Wait for LB to drain before SIGTERM
      grace_period_seconds: 600  # Covers full 10-min LPP + cleanup (max allowed)
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30

    envs:
      # JIRA Configuration
      - key: JIRA_PROJECT_KEY
        value: ""
        scope: RUN_TIME
      - key: JIRA_ISSUE_TYPE
        value: "Support"
        scope: RUN_TIME
      # /chat/notify ticketing: keep alerts internal unless Jira is intentionally selected.
      - key: NOTIFY_TICKETS_BACKEND
        value: "internal"
        scope: RUN_TIME
      # Set false only to bypass alert correlation; ticketing remains fail-open.
      - key: ALERT_CORRELATION_ENABLED
        value: "true"
        scope: RUN_TIME

      # After-hours escalation handling begins at this hour (0-23).
      - key: AFTER_HOURS_START_HOUR
        value: "19"
        scope: RUN_TIME

      # Response Verification (LLM-as-judge for customer mode)
      # Its model tier (MODEL_LITE) lives at app level (see envs: above), not here.
      - key: VERIFICATION_ENABLED
        value: "true"
        scope: RUN_TIME
      - key: VERIFICATION_DOC_ID
        value: "your-verification-doc-id"  # pragma: allowlist secret
        scope: RUN_TIME

      # Urgent /chat/notify live inverter-output lookup budget
      - key: URGENT_ALERT_LIVE_OUTPUT_TIMEOUT_SECONDS
        value: "3"
        scope: RUN_TIME

      # Mini App Forms (Telegram WebApp popup)
      - key: MINI_APP_BASE_URL
        value: "https://your-app.example.com/mini-app/"
        scope: RUN_TIME
      # All other env vars inherited from app-level

  # ---------------------------------------------------------------------------
  # Service 2: Anansi App
  # NiceGUI app for chat history, settings, grid design, and broadcasts
  # Uses Dockerfile to include shared/ for telegram_markdown, etc.
  # ---------------------------------------------------------------------------
  - name: anansi-app
    github:
      repo: your-org/anansi
      branch: main
      deploy_on_push: true
    dockerfile_path: anansi_app/Dockerfile
    http_port: 8501
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      # NiceGUI app serves /healthz (was Streamlit's /_stcore/health).
      http_path: /healthz
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 10

    envs:
      # Internal URL for scheduled command execution
      - key: CHAT_ORCHESTRATOR_URL
        value: "${chat-orchestrator.PRIVATE_URL}"
        scope: RUN_TIME
      # SUPABASE_URL, SUPABASE_KEY, CHAT_DB_URL, CHAT_DB_SERVICE_KEY inherited from app-level
      - key: DIGITALOCEAN_APP_ID
        value: "your-digitalocean-app-id"
        scope: RUN_TIME
      - key: DIGITALOCEAN_API_TOKEN
        value: "${DIGITALOCEAN_API_TOKEN}"
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # AUTH_CLIENT_ID/AUTH_CLIENT_SECRET inherited from app-level (see the
      # top-level envs: block) - promoted there so mcp-gateway's service can
      # reuse the same client. The rest of this app's own OAuth login config
      # stays service-scoped, since only anansi-app needs it.
      - key: AUTH_REDIRECT_URI
        value: "https://your-app.example.com/oauth2callback"
        scope: RUN_TIME
      - key: AUTH_SERVER_METADATA_URL
        value: "https://accounts.google.com/.well-known/openid-configuration"
        scope: RUN_TIME
      - key: AUTH_COOKIE_SECRET
        value: "${AUTH_COOKIE_SECRET}"
        scope: RUN_TIME
        type: SECRET
      # Telegram (for broadcast sender)
      - key: TELEGRAM_BOT_TOKEN
        value: "${TELEGRAM_BOT_TOKEN}"
        scope: RUN_TIME
        type: SECRET
      # Admin access list (service-specific override)
      - key: ALLOWED_VIEWER_EMAILS
        value: "admin@example.com"
        scope: RUN_TIME
      # All other env vars inherited from app-level

  # ---------------------------------------------------------------------------
  # Service 3: MCP Gateway
  # Per-user MCP access for external clients (Claude, Codex). Dedicated
  # service and ingress rule - deliberately NOT folded into chat-orchestrator,
  # which has no bearer-token auth model of its own. AUTH_DB_HOST/PORT/NAME/
  # USER/PASSWORD (used by gateway/oauth_store_pg.py) are inherited from
  # app-level, same as anansi-app's SUPABASE_*/CHAT_DB_* above.
  # ---------------------------------------------------------------------------
  - name: mcp-gateway
    github:
      repo: your-org/anansi
      branch: main
      deploy_on_push: true
    dockerfile_path: mcp_servers/gateway/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 30
    envs:
      - key: MCP_GATEWAY_TOKEN_SECRET
        value: "${MCP_GATEWAY_TOKEN_SECRET}"
        scope: RUN_TIME
        type: SECRET
      # This service's own public origin, INCLUDING the /mcp-gateway ingress
      # prefix below (e.g. "https://your-app.example.com/mcp-gateway") - it
      # is embedded verbatim into both discovery documents and is the value
      # Google's redirect_uri check validates against, so getting this wrong
      # fails visibly (a client can't discover the right endpoints, or
      # Google rejects the callback) rather than silently.
      - key: MCP_GATEWAY_BASE_URL
        value: "https://your-app.example.com/mcp-gateway"
        scope: RUN_TIME
      # No GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET here on purpose: this
      # service inherits AUTH_CLIENT_ID/AUTH_CLIENT_SECRET from app-level
      # (see the top-level envs: block's comment) and
      # gateway/google_oauth_client.py falls back to those exact names when
      # GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET aren't set - reusing anansi-
      # app's existing Web-application OAuth client rather than needing a
      # second one. Set GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET here only if
      # this deployment genuinely wants the gateway on a DIFFERENT client
      # than anansi-app's own login.
        type: SECRET

