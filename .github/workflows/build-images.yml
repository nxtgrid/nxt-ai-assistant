# Builds and publishes service images to GHCR so App Platform (or any other
# container host) can deploy from a prebuilt image instead of building the
# Dockerfile on every deploy. Purely additive: it does not change the
# default github-build path in .do/app.example.yaml and does not deploy
# anything itself — see .do/app.image.example.yaml and the README's
# "Faster deploys" section to opt in.
name: Build & Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      chat_orchestrator: ${{ steps.filter.outputs.chat_orchestrator }}
      tools_service: ${{ steps.filter.outputs.tools_service }}
      anansi_app: ${{ steps.filter.outputs.anansi_app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            chat_orchestrator:
              - 'chat_orchestrator/**'
              - 'mini_app/**'
              - 'rag_pipeline/**'
              - 'mcp_servers/**'
              - 'shared/**'
            tools_service:
              - 'mcp_servers/**'
              - 'shared/**'
            anansi_app:
              - 'anansi_app/**'
              - 'shared/**'

  build-chat-orchestrator:
    name: Build chat-orchestrator
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.chat_orchestrator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image base (GHCR requires lowercase paths)
        run: echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: chat_orchestrator/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/chat-orchestrator:latest
            ${{ env.IMAGE_BASE }}/chat-orchestrator:${{ github.sha }}
          cache-from: type=gha,scope=chat-orchestrator
          cache-to: type=gha,mode=max,scope=chat-orchestrator

  build-tools-service:
    name: Build tools-service
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.tools_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image base (GHCR requires lowercase paths)
        run: echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp_servers/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/tools-service:latest
            ${{ env.IMAGE_BASE }}/tools-service:${{ github.sha }}
          cache-from: type=gha,scope=tools-service
          cache-to: type=gha,mode=max,scope=tools-service

  build-anansi-app:
    name: Build anansi-app
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.anansi_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image base (GHCR requires lowercase paths)
        run: echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: anansi_app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/anansi-app:latest
            ${{ env.IMAGE_BASE }}/anansi-app:${{ github.sha }}
          cache-from: type=gha,scope=anansi-app
          cache-to: type=gha,mode=max,scope=anansi-app
