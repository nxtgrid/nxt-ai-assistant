repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      # Runs on every commit, not just on the staged files: the failure it exists
      # to catch is a test file that is *absent* from the commit.
      - id: test-wiring
        name: Test files are tracked and wired into CI
        entry: python3 .github/scripts/check_test_wiring.py
        language: system
        pass_filenames: false
        always_run: true

      # Repo-wide, not staged-files-only: the check classifies each module's
      # loggers, so it needs to read a file even when the diff only moved a
      # logger binding around.
      - id: loguru-exc-info
        name: No exc_info= on a loguru logger (it drops the traceback)
        entry: python3 .github/scripts/check_loguru_exc_info.py
        language: system
        pass_filenames: false
        always_run: true

      # Scans staged *additions* (including edits to already-tracked files --
      # the gap .gitignore's tests/ rule doesn't cover) against a local,
      # gitignored list of real identifiers. See check_operator_data.py for
      # why, and its list-missing message for setup.
      - id: operator-data
        name: No real grid/customer identifiers in staged changes
        entry: python3 .github/scripts/check_operator_data.py
        language: system
        pass_filenames: false
        always_run: true

      # Same list, applied to the commit message. Needs commit-msg installed
      # too: `pre-commit install --hook-type commit-msg` (default_install_hook_types
      # below covers a fresh `pre-commit install`). pass_filenames is left at
      # its true default here -- for a commit-msg-stage hook that "filename"
      # is the one argument this hook needs: the path to the temp file
      # holding the message about to be committed.
      - id: operator-data-commit-msg
        name: No real grid/customer identifiers in the commit message
        entry: python3 .github/scripts/check_operator_data.py --commit-msg
        language: system
        stages: [commit-msg]

default_install_hook_types: [pre-commit, commit-msg]
